name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fotohaus version
      description: Help ▸ About Fotohaus
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.5, MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: If Fotohaus crashed or won't start, paste the end of ~/Library/Logs/Fotohaus.log
      render: text
