# Tests Fotohaus on macOS, Windows and Linux, and builds the Mac DMG, the Windows installer and the Linux AppImage.
#   - every push to main and every pull request: tests + builds (downloadable under the run's Artifacts)
#   - a version tag (v1.2.0): the same, then the DMG, installer, AppImage and GPL sources are attached to that release
# It also builds the two store packages, to upload by hand (packaging/STORES.md): the MSIX for the
# Microsoft Store (artifact "Store-Windows-MSIX") and the Flatpak for Flathub ("Store-Linux-Flatpak").
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt -r requirements-dev.txt -c packaging/constraints.txt
      - run: python .github/scripts/run_tests.py tests/test_fotohaus.py
      - run: python .github/scripts/run_tests.py tests/test_review.py

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lief pillow
      - name: Build
        run: |
          sudo apt-get update
          python packaging/build_linux.py --out build
      - name: Smoke test (starts the app headless and quits)
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          export QT_QPA_PLATFORM=offscreen FOTOHAUS_HOME="$RUNNER_TEMP/fh" FOTOHAUS_AUTOQUIT_MS=4000
          ./build/Fotohaus-*-x86_64.AppImage --appimage-extract-and-run | tee smoke.txt
          grep -q "FOTOHAUS_AUTOQUIT ok" smoke.txt
          ./build/Fotohaus-*-x86_64.AppImage --appimage-extract-and-run stats
      - uses: actions/upload-artifact@v4
        with:
          name: Fotohaus-Linux
          path: build/Fotohaus-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lief pillow
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - uses: ilammy/msvc-dev-cmd@v1      # cl and rc, to compile Fotohaus.exe
      - name: Build (installer and Microsoft Store package)
        shell: pwsh
        env:
          # the package identity from Partner Center, kept as repository variables (packaging/STORES.md);
          # without them a test identity is used
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: python packaging/build_windows.py --out build --msix --iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      - name: Smoke test (starts the installed app folder headless and quits)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FOTOHAUS_AUTOQUIT_MS: "4000"
        run: |
          $env:FOTOHAUS_HOME = "$env:RUNNER_TEMP\fh"
          & .\build\Fotohaus\fotohaus-cli.exe stats
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process -FilePath .\build\Fotohaus\Fotohaus.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA\Fotohaus\Fotohaus.log" -ErrorAction SilentlyContinue; exit 1 }
      - name: Smoke test of the Store package (installs a test-signed copy, runs its command line tool)
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          # The Store signs the real package. To install it here, a copy is signed with a throwaway
          # certificate that carries the same publisher name.
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { "CN=Fotohaus Dev" }
          $copy = "$env:RUNNER_TEMP\Fotohaus-test.msix"
          Copy-Item (Get-ChildItem build\Fotohaus-*-x64.msix).FullName $copy
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName "Fotohaus test" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\fotohaus-test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\fotohaus-test.cer" -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
          signtool sign /fd SHA256 /sha1 $cert.Thumbprint $copy
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Add-AppxPackage -Path $copy
          Get-AppxPackage | Where-Object { $_.PackageFullName -like "*Fotohaus*" } | Format-List Name, Version, InstallLocation
          & "$env:LOCALAPPDATA\Microsoft\WindowsApps\fotohaus-cli.exe" stats
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Code signing goes here once SignPath has approved the project (see packaging/SIGNING.md).
      - uses: actions/upload-artifact@v4
        with:
          name: Fotohaus-Windows
          path: build/Fotohaus-*-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Store-Windows-MSIX        # unsigned on purpose: upload it to Partner Center, which signs it
          path: build/Fotohaus-*-x64.msix
          if-no-files-found: error

  screenshots:
    name: Store screenshots
    # Opens Fotohaus on Windows with sample photos and saves 1920 x 1080 screenshots for the store
    # listings (artifact "Store-Screenshots"). See packaging/store_screenshots.py.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -c packaging/constraints.txt
      - name: Screen of 1920 x 1080 (the runner starts with a smaller one)
        continue-on-error: true
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
      - name: Screenshots
        shell: pwsh
        run: |
          python packaging/store_screenshots.py --out build/screenshots
          if ($LASTEXITCODE -eq 3) {
            Write-Host "The screen is smaller than 1920 x 1080: taking them off-screen instead"
            $env:QT_QPA_PLATFORM = "offscreen"
            python packaging/store_screenshots.py --out build/screenshots
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Store-Screenshots
          path: build/screenshots/*.png
          if-no-files-found: error

  flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils appstream desktop-file-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0    # lets Flatpak's sandbox start on the runner
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Check the menu entry and the store description
        run: |
          python packaging/flatpak/install.py --metadata-only build/meta
          desktop-file-validate build/meta/applications/*.desktop
          appstreamcli validate --no-net build/meta/metainfo/*.xml
      - name: Build
        run: |
          flatpak-builder --user --install --install-deps-from=flathub --force-clean \
            --state-dir="$RUNNER_TEMP/flatpak-state" --repo="$RUNNER_TEMP/flatpak-repo" \
            "$RUNNER_TEMP/flatpak-build" packaging/flatpak/io.github.aelnagish.Fotohaus.yml
      - name: Libraries the runtime doesn't have (for information; optional Qt plugins may list some)
        run: |
          flatpak run --command=sh io.github.aelnagish.Fotohaus -c \
            'find /app/lib -name "*.so*" -type f | while read -r f; do ldd "$f" 2>/dev/null | grep "not found" | sed "s|^|$f:|"; done | sort -u' | tee missing.txt
          echo "$(cut -d: -f2 missing.txt | sort -u | wc -l) different libraries not found"
      - name: Smoke test (starts the app headless and quits)
        run: |
          flatpak run --env=QT_QPA_PLATFORM=offscreen --env=FOTOHAUS_AUTOQUIT_MS=4000 io.github.aelnagish.Fotohaus | tee smoke.txt
          grep -q "FOTOHAUS_AUTOQUIT ok" smoke.txt
          flatpak run --command=fotohaus-cli io.github.aelnagish.Fotohaus stats
      - name: Bundle
        run: |
          mkdir -p build
          flatpak build-bundle "$RUNNER_TEMP/flatpak-repo" build/Fotohaus-x86_64.flatpak io.github.aelnagish.Fotohaus \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -la build/Fotohaus-x86_64.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: Store-Linux-Flatpak
          path: build/Fotohaus-x86_64.flatpak
          if-no-files-found: error
      - name: Flathub's own checks (for information; what they report is listed in packaging/STORES.md)
        continue-on-error: true
        run: |
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/io.github.aelnagish.Fotohaus.yml || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo "$RUNNER_TEMP/flatpak-repo" || true

  mac:
    name: Mac disk image
    # Cross-built on Linux, exactly as the 1.0.x DMGs were: a native HFS+ image, ad-hoc signed.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PBS_TAG: "20261026"
      PBS_PY: "3.12.16"
      PBS_SHA256: fbf4afef53c2a6b72bb741bc06d5671a9dfaf87bd84e5aa73ac9b3d0d589f14e
      CODESIGN_TOOL_VERSION: "0.29.0"
      CODESIGN_TOOL_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
      LIBDMG_COMMIT: e18579b391950589b9ed16ee630c54ce4319bb29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lief
      - name: Tools (lipo, HFS+, libdmg-hfsplus, rcodesign, macOS Python)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18 hfsprogs cmake zlib1g-dev libbz2-dev libssl-dev
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -sSfL -o py.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/cpython-${PBS_PY}+${PBS_TAG}-aarch64-apple-darwin-install_only.tar.gz"
          echo "${PBS_SHA256}  py.tar.gz" | sha256sum -c -
          curl -sSfL -o rc.tgz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${CODESIGN_TOOL_VERSION}/apple-codesign-${CODESIGN_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CODESIGN_TOOL_SHA256}  rc.tgz" | sha256sum -c -
          tar xzf rc.tgz --strip-components=1
          git clone -q https://github.com/mozilla/libdmg-hfsplus && git -C libdmg-hfsplus checkout -q "$LIBDMG_COMMIT"
          cmake -S libdmg-hfsplus -B libdmg-hfsplus/build -DCMAKE_BUILD_TYPE=Release
          cmake --build libdmg-hfsplus/build -j4
          cp "$(find libdmg-hfsplus/build -type f -name dmg -perm -u+x | head -1)" .
          cp "$(find libdmg-hfsplus/build -type f -name hfsplus -perm -u+x | head -1)" .
          ls -la
      - name: Build
        run: |
          T="$RUNNER_TEMP/tools"
          python packaging/build_mac_app.py --python-tar "$T/py.tar.gz" --out build \
            --lipo "$(command -v llvm-lipo-18)" --pyc-python "$(command -v python)" \
            --rcodesign "$T/rcodesign" --hfsplus "$T/hfsplus" --dmg-tool "$T/dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Fotohaus-Mac
          path: build/Fotohaus-*-arm64.dmg
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Fotohaus-*        # the downloads; the Store-* packages go to their stores instead
          path: dist
          merge-multiple: true
      - name: GPL source archive
        # The GPL libraries are pinned (packaging/constraints.txt), so the archive made for 1.0.1 still
        # holds their exact source. Re-attach it under this release's name.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.1 -R "$GITHUB_REPOSITORY" -p 'fotohaus-1.0.1-gpl-sources.tar' -D "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/fotohaus-1.0.1-gpl-sources.tar" "dist/fotohaus-${GITHUB_REF_NAME#v}-gpl-sources.tar"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
