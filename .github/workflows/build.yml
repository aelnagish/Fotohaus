# Tests Fotohaus on macOS, Windows and Linux, and builds the Mac DMG, the Windows installer and the Linux AppImage.
#   - every push to main and every pull request: tests + builds (downloadable under the run's Artifacts)
#   - a version tag (v1.2.0): the same, then the DMG, installer, AppImage and GPL sources are attached to that release
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt -r requirements-dev.txt -c packaging/constraints.txt
      - run: python .github/scripts/run_tests.py tests/test_fotohaus.py
      - run: python .github/scripts/run_tests.py tests/test_review.py

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lief pillow
      - name: Build
        run: |
          sudo apt-get update
          python packaging/build_linux.py --out build
      - name: Smoke test (starts the app headless and quits)
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          export QT_QPA_PLATFORM=offscreen FOTOHAUS_HOME="$RUNNER_TEMP/fh" FOTOHAUS_AUTOQUIT_MS=4000
          ./build/Fotohaus-*-x86_64.AppImage --appimage-extract-and-run | tee smoke.txt
          grep -q "FOTOHAUS_AUTOQUIT ok" smoke.txt
          ./build/Fotohaus-*-x86_64.AppImage --appimage-extract-and-run stats
      - uses: actions/upload-artifact@v4
        with:
          name: Fotohaus-Linux
          path: build/Fotohaus-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lief pillow
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - uses: ilammy/msvc-dev-cmd@v1      # cl and rc, to compile Fotohaus.exe
      - name: Build
        shell: pwsh
        run: python packaging/build_windows.py --out build --iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      - name: Smoke test (starts the installed app folder headless and quits)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FOTOHAUS_AUTOQUIT_MS: "4000"
        run: |
          $env:FOTOHAUS_HOME = "$env:RUNNER_TEMP\fh"
          & .\build\Fotohaus\fotohaus-cli.exe stats
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process -FilePath .\build\Fotohaus\Fotohaus.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA\Fotohaus\Fotohaus.log" -ErrorAction SilentlyContinue; exit 1 }
      # Code signing goes here once SignPath has approved the project (see packaging/SIGNING.md).
      - uses: actions/upload-artifact@v4
        with:
          name: Fotohaus-Windows
          path: build/Fotohaus-*-Setup.exe
          if-no-files-found: error

  mac:
    name: Mac disk image
    # Cross-built on Linux, exactly as the 1.0.x DMGs were: a native HFS+ image, ad-hoc signed.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PBS_TAG: "20261026"
      PBS_PY: "3.12.16"
      PBS_SHA256: fbf4afef53c2a6b72bb741bc06d5671a9dfaf87bd84e5aa73ac9b3d0d589f14e
      CODESIGN_TOOL_VERSION: "0.29.0"
      CODESIGN_TOOL_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
      LIBDMG_COMMIT: e18579b391950589b9ed16ee630c54ce4319bb29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lief
      - name: Tools (lipo, HFS+, libdmg-hfsplus, rcodesign, macOS Python)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18 hfsprogs cmake zlib1g-dev libbz2-dev libssl-dev
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -sSfL -o py.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/cpython-${PBS_PY}+${PBS_TAG}-aarch64-apple-darwin-install_only.tar.gz"
          echo "${PBS_SHA256}  py.tar.gz" | sha256sum -c -
          curl -sSfL -o rc.tgz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${CODESIGN_TOOL_VERSION}/apple-codesign-${CODESIGN_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CODESIGN_TOOL_SHA256}  rc.tgz" | sha256sum -c -
          tar xzf rc.tgz --strip-components=1
          git clone -q https://github.com/mozilla/libdmg-hfsplus && git -C libdmg-hfsplus checkout -q "$LIBDMG_COMMIT"
          cmake -S libdmg-hfsplus -B libdmg-hfsplus/build -DCMAKE_BUILD_TYPE=Release
          cmake --build libdmg-hfsplus/build -j4
          cp "$(find libdmg-hfsplus/build -type f -name dmg -perm -u+x | head -1)" .
          cp "$(find libdmg-hfsplus/build -type f -name hfsplus -perm -u+x | head -1)" .
          ls -la
      - name: Build
        run: |
          T="$RUNNER_TEMP/tools"
          python packaging/build_mac_app.py --python-tar "$T/py.tar.gz" --out build \
            --lipo "$(command -v llvm-lipo-18)" --pyc-python "$(command -v python)" \
            --rcodesign "$T/rcodesign" --hfsplus "$T/hfsplus" --dmg-tool "$T/dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Fotohaus-Mac
          path: build/Fotohaus-*-arm64.dmg
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GPL source archive
        # The GPL libraries are pinned (packaging/constraints.txt), so the archive made for 1.0.1 still
        # holds their exact source. Re-attach it under this release's name.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.1 -R "$GITHUB_REPOSITORY" -p 'fotohaus-1.0.1-gpl-sources.tar' -D "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/fotohaus-1.0.1-gpl-sources.tar" "dist/fotohaus-${GITHUB_REF_NAME#v}-gpl-sources.tar"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
